name: Pre-Market Report

on:
  # Target: email lands at 7:00 AM Central (8:00 AM New York), Monday to Friday.
  #
  # Main trigger: an external scheduler (e.g. cron-job.org, set to 7:00 AM America/Chicago on
  # weekdays) calls the workflow_dispatch API with {"ref":"main","inputs":{"automated":"true"}}.
  # GitHub's own cron is often hours late, while API-triggered runs start within a minute.
  #
  # Backup trigger: GitHub's cron, in case the external call never arrives. GitHub runs cron in
  # UTC and doesn't adjust for daylight saving time: 6:45 AM Central = 11:45 UTC in summer (CDT)
  # and 12:45 UTC in winter (CST). Both are scheduled; the "gate" job lets through only the one
  # that matches today's clock, and only if today's report hasn't gone out yet and the market
  # hasn't opened.
  schedule:
    - cron: "45 11 * * 1-5"
    - cron: "45 12 * * 1-5"
  workflow_dispatch:          # "Run workflow" button on the Actions tab, and the external scheduler
    inputs:
      dry_run:
        description: "Build the report without emailing it"
        type: boolean
        default: false
      automated:
        description: "Set by the external scheduler: skip if already sent today or past 8:30 AM Central"
        type: boolean
        default: false

permissions:
  contents: write             # lets the run push today's report to the "reports" branch

concurrency:
  group: premarket-report     # never two reports at once
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      automated: ${{ steps.check.outputs.automated }}
    steps:
      # Manual runs always go through. Automated runs (external scheduler or GitHub cron) are
      # skipped when today's report already went out (the publish step below commits
      # "Report for <date>" to the reports branch only after a successful send) or when it's past
      # 8:30 AM Central, since a pre-market report sent after the open is stale.
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          AUTOMATED_INPUT: ${{ inputs.automated }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZONE=$(TZ=America/Chicago date +%Z)   # "CDT" in summer, "CST" in winter
          NOW=$(TZ=America/Chicago date +%H%M)  # e.g. 0703
          TODAY=$(TZ=America/Chicago date +%F)
          AUTOMATED=true
          if [ "$EVENT" != "schedule" ] && [ "$AUTOMATED_INPUT" != "true" ]; then
            AUTOMATED=false
          fi

          if [ "$AUTOMATED" = "false" ]; then
            RUN=true; WHY="manual run"
          elif [ "$EVENT" = "schedule" ] && ! { [ "$SCHEDULE" = "45 11 * * 1-5" ] && [ "$ZONE" = "CDT" ]; } \
                                         && ! { [ "$SCHEDULE" = "45 12 * * 1-5" ] && [ "$ZONE" = "CST" ]; }; then
            RUN=false; WHY="this cron is for the other half of the year"
          elif [ "$((10#$NOW))" -ge 830 ]; then
            RUN=false; WHY="past 8:30 AM Central, the report would be stale"
          elif [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/reports" --jq .commit.message 2>/dev/null)" = "Report for $TODAY" ]; then
            RUN=false; WHY="today's report was already sent"
          else
            RUN=true; WHY="automated run"
          fi
          echo "event=$EVENT schedule='$SCHEDULE' chicago=$ZONE $NOW -> run=$RUN ($WHY)"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "automated=$AUTOMATED" >> "$GITHUB_OUTPUT"

  report:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Backup cron runs start ~6:45 AM Central; hold until 7:00 so the data is fresh and the email
      # arrives on time. If the run started after 7:00, this doesn't wait at all.
      # Manual runs ("Run workflow" button) skip the wait.
      - name: Wait until 7:00 AM Central
        if: needs.gate.outputs.automated == 'true'
        run: |
          TARGET=$(TZ=America/Chicago date -d "07:00" +%s)
          WAIT=$(( TARGET - $(date +%s) ))
          if [ "$WAIT" -gt 0 ] && [ "$WAIT" -le 3600 ]; then
            echo "Waiting ${WAIT}s until 7:00 AM Central"
            sleep "$WAIT"
          else
            echo "Already past 7:00 AM Central (or >1h early); running now"
          fi

      - name: Build and send the report
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python main.py --dry-run
          else
            python main.py
          fi

      # The README shows reports/latest.png and links to reports/latest.pdf. The branch is rebuilt
      # from scratch and force-pushed each day, so old PDFs don't pile up in the repo's history.
      # The commit message doubles as the "already sent today" marker the gate job checks, so
      # dry runs get a different message.
      - name: Publish today's report to the reports branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          MSG="Report for $(TZ=America/Chicago date +%F)"
          if [ "$DRY_RUN" = "true" ]; then MSG="$MSG (dry run)"; fi
          PDF=$(ls output/*.pdf 2>/dev/null | head -n 1)
          if [ -z "$PDF" ]; then
            echo "No PDF was built today; leaving yesterday's report up"
            exit 0
          fi
          DIR="$RUNNER_TEMP/reports"
          mkdir -p "$DIR"
          cp "$PDF" "$DIR/latest.pdf"
          python -m src.preview "$PDF" "$DIR/latest.png"
          cd "$DIR"
          git init -q -b reports
          git add latest.pdf latest.png
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "$MSG"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" reports

      # Keeps each day's HTML/PDF for 14 days under the run's "Artifacts" section
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: premarket-report-${{ github.run_id }}
          path: output/
          retention-days: 14
          if-no-files-found: ignore
