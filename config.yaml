# Add stock symbol you want analysis for
watchlist:
  - NBIS
  - MRVL
  - NVDA
  - SNDK
  - MU
  - SLS
  - RDDT
  - RZLV
  - NOW
  - GOOGL
  - GEV

analysis_thresholds:
  # Price moves. A move alerts if it is at least this big AND a normal-sized move for the stock,
  # OR if it's unusually big for that particular stock (see unusual_move_sigma).
  price_change_pct: 5.0          # last regular session's close-to-close move
  premarket_gap_pct: 3.0         # pre-market price vs. last close
  unusual_move_sigma: 2.0        # ...or a move >= 2x the stock's typical daily move
  min_move_pct: 1.5              # ...as long as it's at least 1.5% (ignores calm-stock wiggles)

  volume_surge_multiplier: 2.0   # volume vs. the previous 20 sessions' average
  rsi_oversold: 30
  rsi_overbought: 70
  rsi_bullish: 50
  near_52w_pct: 3.0              # "within 3% of the 52-week high/low" note
  earnings_lookahead_days: 7     # warn about earnings this many days ahead

  # Positioning (Yahoo). Each list splits values into levels; the report explains what each
  # level means. Positioning alerts are minor (severity < 1): they show on the stock's own
  # page, not in the header.
  short_interest_levels_pct: [5, 10, 20]  # % of float: low / moderate / high / very high (alert)
  days_to_cover_levels: [2, 5, 10]         # days: low / moderate / high / very high
  put_call_levels: [0.5, 0.8, 1.2, 1.5]    # put/call open interest: very bullish (alert) / bullish /
                                           #   neutral / cautious / bearish (alert)
  options_window_days: 30          # count open interest for expirations this many days out
  options_min_open_interest: 1000  # ignore the ratio on thinly traded option chains
  calls_expiring_week_pct: 50      # alert when this % of those calls expire by Friday. Monthly
                                   #   expiration weeks (3rd Friday) usually trip it for most stocks
  cash_runway_levels_months: [12, 24]  # cash-burning companies: months of cash left at the current burn.
                                       #   short (alert) / moderate / long

report:
  title: "Pre-Market Brief"
  header_min_severity: 1.0       # alerts below this stay on the stock's own page, not the header
  news_per_stock: 3
  attach_pdf: true

market_movers:
  enabled: true                  # "Outside your watchlist" section (Yahoo gainers/losers/most active)
  count: 5

# "Why it's moving": up to two sentences per flagged stock, written by Claude from that stock's
# fresh news, analyst rating changes and sector move, with every source credited. Needs
# ANTHROPIC_API_KEY; without it the report goes out without these lines. Sonnet at medium
# effort costs roughly 3-4 cents a run; claude-haiku-5-5 at low effort is well under a cent
# but writes plainer lines.
explainer:
  enabled: true
  model: claude-sonnet-5-5
  effort: medium                 # low | medium | high
  max_articles: 5                # headlines sent per stock
  summary_chars: 300             # each article summary is trimmed to this length
  timeout_seconds: 90

# News sentiment, scored by FinBERT (ProsusAI/finbert, a free financial-news model that runs on the
# GitHub runner's CPU; install with requirements-sentiment.txt). Without it, the report falls back
# to counting bullish/bearish keywords and says so. Sentiment doesn't raise alerts yet.
sentiment:
  enabled: true
  model: ProsusAI/finbert
  input: headline+summary        # "headline", or "headline+summary" (headline + first sentences)
  summary_sentences: 2
  skip_summaries_starting_with:  # teaser "summaries" about other stories; headline used alone
    - "Today's big story"
  batch_size: 16
  compare_inputs: false          # true: log headline-only vs. headline+summary scores on a dry run
  # A stock's score: P(positive) - P(negative) per article, averaged over articles that name the
  # stock (ticker, company name or an alias below), weighted by how fresh they are.
  weights:
    since last close: 1.0
    during last session: 0.6
    older: 0.3
    unknown: 0.5
  label_threshold: 0.25          # Bullish at +0.25 or above, Bearish at -0.25 or below
  confident_probability: 0.70    # Mixed: a >=70% positive and a >=70% negative article, net score near 0
  min_relevant_articles: 2       # fewer relevant articles than this is always Neutral
  strongest_min_net: 0.5         # "strongest story": only if its P(pos) - P(neg) is at least this far from 0
  shift_window_days: 5           # tone shift: compare today with the average of up to this many report days
  shift_min_days: 3              # ...needing at least this many logged days
  shift_min_change: 0.4          # ...and a change in score at least this big
  aliases:                       # names news uses that differ from the company's legal name
    GOOGL: [Google]
    GOOG: [Google]

# Sector groups for the "why it's moving" line ("fell with chip stocks"). Each stock is matched
# automatically to the sector fund its daily returns move with (market move removed); when that
# match is weak or a near-tie, Yahoo's sector/industry label decides instead. New tickers need
# no setup. The run log prints each stock's group and how it was chosen.
sectors:
  min_match_score: 0.30          # weaker price matches fall back to Yahoo's label
  min_match_lead: 0.03           # ...as do near-ties between the top two funds
  min_history_days: 60           # shared trading days needed for a price match (newer listings
                                 #   use the label); kept low so young theme funds like NCLD count
  overrides: {}                  # e.g. {AAA: BBB} to force a group

# Today's US economic releases, shown in the market backdrop. Finnhub's economic calendar isn't
# on the free plan, so this list is kept by hand. Times are Central, 24-hour. Only entries
# dated today appear in the report; past ones can be deleted any time.
#   - {date: 2026-12-10, time: "07:30", event: "CPI (Nov)"}
#   - {date: 2026-12-10, time: "13:00", event: "FOMC decision"}
economic_calendar: []